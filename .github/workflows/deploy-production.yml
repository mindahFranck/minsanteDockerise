name: Deploy Health Management System (Laravel)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/health-management-laravel
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/health-management-frontend
  BACKEND_DOMAIN: apiminsante.it-grafik.com
  FRONTEND_DOMAIN: minsante.it-grafik.com
  LETSENCRYPT_EMAIL: mindahnkemeni@gmail.com
  DB_NAME: u877916646_minstante
  DB_USER: minsante

concurrency:
  group: deploy-minsante
  cancel-in-progress: false

jobs:

  build-backend:
    name: Build Laravel Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./laravel-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=https://${{ env.BACKEND_DOMAIN }}/api/v1
            VITE_APP_NAME=Health Management System
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

  deploy-infrastructure:
    name: Ensure shared MariaDB + database
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            docker network create proxy-tier 2>/dev/null || true
            docker network create db-tier 2>/dev/null || true
            docker ps | grep -q nginx-proxy || echo "⚠️ nginx-proxy not running!"

            # MariaDB partagée (PATNUC, Minsanté, CRCE) — les dumps sont en MariaDB 11.8
            # Créé une seule fois ; plusieurs pipelines peuvent passer ici en même temps
            if ! docker ps -a --format '{{.Names}}' | grep -qx itg-mariadb; then
              docker run -d \
                --name itg-mariadb \
                --network db-tier \
                --restart unless-stopped \
                -e MARIADB_ROOT_PASSWORD="${{ secrets.MARIADB_ROOT_PASSWORD }}" \
                -v itg_mariadb_data:/var/lib/mysql \
                mariadb:11.8 \
                --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci \
                || echo "itg-mariadb créé en parallèle par un autre pipeline"
            fi
            docker start itg-mariadb >/dev/null
            for i in $(seq 1 30); do
              docker exec itg-mariadb healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1 && break
              sleep 2
            done

            # Base + utilisateur dédiés (idempotent, aucune table touchée — pas de migration)
            docker exec -i -e MYSQL_PWD="${{ secrets.MARIADB_ROOT_PASSWORD }}" itg-mariadb mariadb -uroot <<'SQL'
            CREATE DATABASE IF NOT EXISTS ${{ env.DB_NAME }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS '${{ env.DB_USER }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';
            ALTER USER '${{ env.DB_USER }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';
            GRANT ALL PRIVILEGES ON ${{ env.DB_NAME }}.* TO '${{ env.DB_USER }}'@'%';
            FLUSH PRIVILEGES;
            SQL

            TABLES=$(docker exec -e MYSQL_PWD="${{ secrets.MARIADB_ROOT_PASSWORD }}" itg-mariadb mariadb -uroot -N -e \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${{ env.DB_NAME }}'")
            echo "✅ ${{ env.DB_NAME }} prête ($TABLES tables)"
            # Laravel ne lance aucune migration : sans le dump, toutes les routes renverraient 500
            [ "$TABLES" != "0" ] || { echo "❌ Base vide : importer le dump (deploy-vps/import-dump.sh) avant de déployer"; exit 1; }

            # L'ancien backend Node n'a plus d'utilité
            docker rm -f health-redis 2>/dev/null || true

  deploy-backend:
    name: Deploy Laravel Backend (with rollback)
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker rename health-backend health-backend-old 2>/dev/null || true
            docker stop health-backend-old 2>/dev/null || true

            # Fichiers téléversés (images FOSA) et logs Laravel persistants
            sudo mkdir -p /var/health-laravel/public /var/health-laravel/logs
            sudo chown -R 33:33 /var/health-laravel

            rollback() {
              echo "❌ Rolling back backend"
              docker logs --tail 200 health-backend 2>/dev/null || true
              docker rm -f health-backend 2>/dev/null || true
              docker rename health-backend-old health-backend 2>/dev/null || true
              docker start health-backend 2>/dev/null || true
              exit 1
            }

            docker run -d \
              --name health-backend \
              --restart unless-stopped \
              --network db-tier \
              -e VIRTUAL_HOST=${{ env.BACKEND_DOMAIN }} \
              -e VIRTUAL_PORT=80 \
              -e LETSENCRYPT_HOST=${{ env.BACKEND_DOMAIN }} \
              -e LETSENCRYPT_EMAIL=${{ env.LETSENCRYPT_EMAIL }} \
              -e APP_NAME="API Health FOSA" \
              -e APP_ENV=production \
              -e APP_KEY="${{ secrets.APP_KEY }}" \
              -e APP_DEBUG=false \
              -e APP_URL=https://${{ env.BACKEND_DOMAIN }} \
              -e LOG_CHANNEL=daily \
              -e LOG_LEVEL=info \
              -e DB_CONNECTION=mysql \
              -e DB_HOST=itg-mariadb \
              -e DB_PORT=3306 \
              -e DB_DATABASE=${{ env.DB_NAME }} \
              -e DB_USERNAME=${{ env.DB_USER }} \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e CACHE_STORE=file \
              -e SESSION_DRIVER=file \
              -e QUEUE_CONNECTION=sync \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_TTL=10080 \
              -e JWT_REFRESH_TTL=43200 \
              -e CORS_ALLOWED_ORIGINS=https://${{ env.FRONTEND_DOMAIN }} \
              -e L5_SWAGGER_GENERATE_ALWAYS=false \
              -e L5_SWAGGER_CONST_HOST=https://${{ env.BACKEND_DOMAIN }}/api/v1 \
              -v /var/health-laravel/public:/var/www/html/storage/app/public \
              -v /var/health-laravel/logs:/var/www/html/storage/logs \
              ${{ env.BACKEND_IMAGE }}:latest || rollback
            docker network connect proxy-tier health-backend

            HEALTHY=0
            for i in $(seq 1 18); do
              if docker exec health-backend curl -fsS http://localhost/api/health/ready -o /dev/null 2>&1; then
                HEALTHY=1; break
              fi
              echo "  attempt $i: /api/health/ready not OK yet"; sleep 5
            done
            [ "$HEALTHY" = "1" ] || rollback
            docker rm -f health-backend-old 2>/dev/null || true
            echo "✅ Laravel backend OK"

  deploy-frontend:
    name: Deploy Frontend (with rollback)
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            docker pull ${{ env.FRONTEND_IMAGE }}:latest
            docker rename health-frontend health-frontend-old 2>/dev/null || true
            docker stop health-frontend-old 2>/dev/null || true

            rollback() {
              echo "❌ Rolling back frontend"
              docker logs --tail 100 health-frontend 2>/dev/null || true
              docker rm -f health-frontend 2>/dev/null || true
              docker rename health-frontend-old health-frontend 2>/dev/null || true
              docker start health-frontend 2>/dev/null || true
              exit 1
            }

            docker run -d \
              --name health-frontend \
              --restart unless-stopped \
              --network proxy-tier \
              -e VIRTUAL_HOST=${{ env.FRONTEND_DOMAIN }} \
              -e VIRTUAL_PORT=80 \
              -e LETSENCRYPT_HOST=${{ env.FRONTEND_DOMAIN }} \
              -e LETSENCRYPT_EMAIL=${{ env.LETSENCRYPT_EMAIL }} \
              ${{ env.FRONTEND_IMAGE }}:latest || rollback

            HEALTHY=0
            for i in $(seq 1 12); do
              if docker exec health-frontend curl -fsS http://localhost/health -o /dev/null 2>&1; then
                HEALTHY=1; break
              fi
              echo "  attempt $i: not ready yet"; sleep 5
            done
            [ "$HEALTHY" = "1" ] || rollback
            docker rm -f health-frontend-old 2>/dev/null || true
            echo "✅ Frontend OK"

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    steps:
      - name: Probe public endpoints
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://${{ env.BACKEND_DOMAIN }}/api/health || echo 000)
            [ "$code" = "200" ] && { echo "✅ https://${{ env.BACKEND_DOMAIN }}/api/health → 200"; break; }
            echo "  attempt $i: got $code, retrying in 10s…"; sleep 10
          done
          echo "🌐 Frontend: https://${{ env.FRONTEND_DOMAIN }}"
          echo "🌐 API:      https://${{ env.BACKEND_DOMAIN }}/api/v1"
