memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 300
expose_php = Off
display_errors = Off
opcache.enable = 1
opcache.validate_timestamps = 0

; Sécurité — php2shell (CVE-2026-109618 / CVE-2026-109619) :
; désactive session.upload_progress, vecteur de 3 des 5 chaînes d'exploit.
; Laravel ne s'en sert pas. Garder le socle PHP à jour (image php:8.3 >= 8.3.36).
session.upload_progress.enabled = 0
